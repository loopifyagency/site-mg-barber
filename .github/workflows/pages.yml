name: Déploiement GitHub Pages

# Publie le site à chaque mise à jour de main (ou à la demande).
# Seuls index.html et assets/ sont servis : les fichiers de travail du dépôt
# (.claude/, .impeccable/, PRODUCT.md, DESIGN.md…) restent hors du site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          test -f index.html
          mkdir _site
          cp index.html _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
